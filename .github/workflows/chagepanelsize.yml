name: Build n Release Change Panel Size Packages
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  build-spk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SPK without Synology toolchain
        run: ./build-spk.sh ./dist
      - name: Verify package metadata and privilege tool
        run: |
          set -eux
          spk=$(ls ./dist/*.spk); d=$(mktemp -d); tar -xf "$spk" -C "$d"
          test "$(grep '^checksum=' "$d/INFO" | cut -d'"' -f2)" = "$(md5sum "$d/package.tgz" | awk '{print $1}')"
          grep -q '^dsmappname=' "$d/INFO"
          tar -tzf "$d/package.tgz" | grep -q 'bin/helper/changepanelsize-helper'
          grep -q '"tool"' "$d/conf/privilege"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./dist/*.spk
      - uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*.spk
